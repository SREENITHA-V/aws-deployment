<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AWS Web App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f4f4f9;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            display: inline-block;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
        }
        button {
            padding: 10px 20px;
            background-color: #FF9900; /* AWS Orange */
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #e88b00;
        }
        #api-response {
            margin-top: 20px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome to My Cloud App!</h1>
        <p>This frontend and backend are running together.</p>
        <button onclick="fetchData()">Test Backend API</button>
        <div id="api-response"></div>
    </div>

    <script>
        async function fetchData() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                document.getElementById('api-response').innerText = data.message + " (" + data.status + ")";
            } catch (error) {
                document.getElementById('api-response').innerText = "Failed to connect to backend!";
            }
        }
    </script>

</body>
</html>
